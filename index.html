<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>골프 라운딩 기록</title>
</head>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 20px auto; padding: 0 12px; }
  section { margin-bottom: 32px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; font-size: 14px; }
  input[type="text"], input[type="number"] { width: 90px; box-sizing: border-box; }
  #course-form input[type="text"] { width: 180px; }
  .row-actions button { margin-right: 4px; }
  .hole-row input[type="text"] { width: 70px; }
  .hole-row input[type="number"] { width: 60px; }
</style>
</head>
<body>
<h1>골프 라운딩 기록</h1>

<section id="course-section">
  <h2>골프장 관리 (F-01)</h2>
  <form id="course-form">
    <input type="hidden" id="course-id">
    <input type="text" id="course-name" placeholder="골프장명 (필수)" required>
    <input type="text" id="course-region" placeholder="지역">
    <input type="text" id="course-memo" placeholder="메모">
    <button type="submit">저장</button>
    <button type="button" id="course-form-cancel" style="display:none">취소</button>
  </form>

  <table id="course-table">
    <thead>
      <tr><th>골프장명</th><th>지역</th><th>메모</th><th>홀 수</th><th></th></tr>
    </thead>
    <tbody id="course-tbody"></tbody>
  </table>
</section>

<section id="hole-section" style="display:none">
  <h3 id="hole-section-title">홀 정보</h3>
  <table id="hole-table">
    <thead>
      <tr><th>코스구분</th><th>홀번호</th><th>파</th><th></th></tr>
    </thead>
    <tbody id="hole-tbody"></tbody>
  </table>
  <button type="button" id="hole-add-row">행 추가</button>
  <button type="button" id="hole-save-btn">홀 정보 저장</button>
</section>

<section id="round-section">
  <h2 id="round-form-title">라운드 신규 등록 (F-02)</h2>
  <form id="round-form">
    <input type="hidden" id="round-id">
    <div><label>일자 <input type="date" id="round-played-on" required></label></div>
    <div><label>골프장 <select id="round-course-id" required></select></label></div>
    <div><label>코스조합 <input type="text" id="round-nine-combo" placeholder="예: OUT-IN"></label></div>
    <div><label>티타임 <input type="time" id="round-tee-time"></label></div>
    <div><label>날씨 <input type="text" id="round-weather" placeholder="맑음/흐림/비/바람"></label></div>
    <div><label>라운드 유형 <input type="text" id="round-type" placeholder="친선/접대/대회"></label></div>
    <div><label>비용 <input type="number" id="round-cost" min="0"></label></div>
    <div><label>메모 <input type="text" id="round-memo"></label></div>
    <button type="submit" id="round-form-submit">라운드 저장</button>
    <button type="button" id="round-form-cancel" style="display:none">취소</button>
  </form>
</section>

<section id="score-section">
  <h2>홀별 스코어 입력 (F-03)</h2>
  <div>
    <label>라운드 선택
      <select id="score-round-id">
        <option value="">-- 라운드를 선택하세요 --</option>
      </select>
    </label>
  </div>
  <table id="score-table" style="display:none">
    <thead>
      <tr><th>코스</th><th>홀</th><th>파</th><th>타수</th><th>퍼팅</th><th>페어웨이 안착</th><th>GIR</th><th>벌타</th></tr>
    </thead>
    <tbody id="score-tbody"></tbody>
  </table>
  <p id="score-total" style="display:none"></p>
  <button type="button" id="score-save-btn" style="display:none">스코어 저장</button>
</section>

<section id="player-section">
  <h2>동반자 명부 (F-04)</h2>
  <form id="player-form">
    <input type="hidden" id="player-id">
    <input type="text" id="player-name" placeholder="이름 (필수)" required>
    <input type="text" id="player-display-name" placeholder="공유용 별칭 (예: 김○○)">
    <input type="text" id="player-relation" placeholder="관계 (친구/거래처/가족 등)">
    <input type="text" id="player-memo" placeholder="메모">
    <button type="submit">저장</button>
    <button type="button" id="player-form-cancel" style="display:none">취소</button>
  </form>

  <table id="player-table">
    <thead>
      <tr><th>이름</th><th>별칭</th><th>관계</th><th>메모</th><th></th></tr>
    </thead>
    <tbody id="player-tbody"></tbody>
  </table>
</section>

<section id="round-player-section">
  <h2>라운드 동반자 연결 (F-04)</h2>
  <div>
    <label>라운드 선택
      <select id="round-player-round-id">
        <option value="">-- 라운드를 선택하세요 --</option>
      </select>
    </label>
  </div>
  <table id="round-player-table" style="display:none">
    <thead>
      <tr><th>참여</th><th>이름</th><th>총타수</th></tr>
    </thead>
    <tbody id="round-player-tbody"></tbody>
  </table>
  <button type="button" id="round-player-save-btn" style="display:none">동반자 저장</button>
</section>

<section id="round-list-section">
  <h2>라운드 목록 (F-05)</h2>
  <button type="button" id="csv-export-btn">전체 라운드 CSV 내보내기 (F-07)</button>
  <table id="round-list-table">
    <thead>
      <tr><th>일자</th><th>골프장</th><th>코스조합</th><th>총타수</th><th>총퍼팅</th><th>비용</th></tr>
    </thead>
    <tbody id="round-list-tbody"></tbody>
  </table>

  <div id="round-detail" style="display:none">
    <h3>라운드 상세</h3>
    <p id="round-detail-summary"></p>
    <table id="round-detail-holes">
      <thead>
        <tr><th>코스</th><th>홀</th><th>파</th><th>타수</th><th>퍼팅</th><th>페어웨이 안착</th><th>GIR</th><th>벌타</th></tr>
      </thead>
      <tbody id="round-detail-holes-tbody"></tbody>
    </table>
    <p id="round-detail-players"></p>
    <button type="button" id="round-detail-edit-btn">라운드 수정</button>
    <button type="button" id="round-detail-delete-btn">라운드 삭제</button>
  </div>
</section>

<script>
// ---------- storage 모듈: localStorage 접근은 이 블록에만 작성한다 ----------

const STORAGE_KEY = "golfRecordingData";

function emptyData() {
  return {
    nextId: {
      courses: 1,
      courseHoles: 1,
      players: 1,
      rounds: 1,
      holeScores: 1,
      roundPlayers: 1,
    },
    courses: [],
    courseHoles: [],
    players: [],
    rounds: [],
    holeScores: [],
    roundPlayers: [],
  };
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return emptyData();
  return JSON.parse(raw);
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function nextId(data, table) {
  const id = data.nextId[table];
  data.nextId[table] = id + 1;
  return id;
}

// ---------- courses ----------

function addCourse(name, region, memo) {
  const data = loadData();
  const course = { id: nextId(data, "courses"), name, region: region || null, memo: memo || null };
  data.courses.push(course);
  saveData(data);
  return course.id;
}

function updateCourse(courseId, name, region, memo) {
  const data = loadData();
  const course = data.courses.find((c) => c.id === courseId);
  course.name = name;
  course.region = region || null;
  course.memo = memo || null;
  saveData(data);
}

function deleteCourse(courseId) {
  const data = loadData();
  data.courses = data.courses.filter((c) => c.id !== courseId);
  data.courseHoles = data.courseHoles.filter((h) => h.courseId !== courseId);
  saveData(data);
}

function getCourse(courseId) {
  const data = loadData();
  return data.courses.find((c) => c.id === courseId) || null;
}

function getAllCourses() {
  const data = loadData();
  return [...data.courses].sort((a, b) => a.name.localeCompare(b.name));
}

// ---------- courseHoles ----------

// holes: [{nineName, holeNo, par, handicap}, ...]
function replaceCourseHoles(courseId, holes) {
  const data = loadData();
  data.courseHoles = data.courseHoles.filter((h) => h.courseId !== courseId);
  for (const h of holes) {
    data.courseHoles.push({
      id: nextId(data, "courseHoles"),
      courseId,
      nineName: h.nineName,
      holeNo: h.holeNo,
      par: h.par ?? 4,
      handicap: h.handicap ?? null,
    });
  }
  saveData(data);
}

function getCourseHoles(courseId) {
  const data = loadData();
  return data.courseHoles
    .filter((h) => h.courseId === courseId)
    .sort((a, b) => a.nineName.localeCompare(b.nineName) || a.holeNo - b.holeNo);
}

// ---------- players ----------

function addPlayer(name, displayName, relation, memo) {
  const data = loadData();
  const player = {
    id: nextId(data, "players"),
    name,
    displayName: displayName || null,
    relation: relation || null,
    memo: memo || null,
  };
  data.players.push(player);
  saveData(data);
  return player.id;
}

function updatePlayer(playerId, name, displayName, relation, memo) {
  const data = loadData();
  const player = data.players.find((p) => p.id === playerId);
  player.name = name;
  player.displayName = displayName || null;
  player.relation = relation || null;
  player.memo = memo || null;
  saveData(data);
}

function deletePlayer(playerId) {
  const data = loadData();
  data.players = data.players.filter((p) => p.id !== playerId);
  data.roundPlayers = data.roundPlayers.filter((rp) => rp.playerId !== playerId);
  saveData(data);
}

function getAllPlayers() {
  const data = loadData();
  return [...data.players].sort((a, b) => a.name.localeCompare(b.name));
}

// ---------- rounds ----------

function addRound(round) {
  const data = loadData();
  const r = {
    id: nextId(data, "rounds"),
    playedOn: round.playedOn,
    courseId: round.courseId,
    nineCombo: round.nineCombo || null,
    teeTime: round.teeTime || null,
    weather: round.weather || null,
    roundType: round.roundType || null,
    cost: round.cost ?? null,
    memo: round.memo || null,
  };
  data.rounds.push(r);
  saveData(data);
  return r.id;
}

function updateRound(roundId, round) {
  const data = loadData();
  const r = data.rounds.find((x) => x.id === roundId);
  r.playedOn = round.playedOn;
  r.courseId = round.courseId;
  r.nineCombo = round.nineCombo || null;
  r.teeTime = round.teeTime || null;
  r.weather = round.weather || null;
  r.roundType = round.roundType || null;
  r.cost = round.cost ?? null;
  r.memo = round.memo || null;
  saveData(data);
}

function deleteRound(roundId) {
  const data = loadData();
  data.rounds = data.rounds.filter((r) => r.id !== roundId);
  data.holeScores = data.holeScores.filter((hs) => hs.roundId !== roundId);
  data.roundPlayers = data.roundPlayers.filter((rp) => rp.roundId !== roundId);
  saveData(data);
}

function getRound(roundId) {
  const data = loadData();
  const r = data.rounds.find((x) => x.id === roundId);
  if (!r) return null;
  const course = data.courses.find((c) => c.id === r.courseId);
  return { ...r, courseName: course ? course.name : null };
}

// 총타수·총퍼팅은 holeScores에서 매번 계산한다 (저장하지 않음)
function getAllRounds() {
  const data = loadData();
  return data.rounds
    .map((r) => {
      const course = data.courses.find((c) => c.id === r.courseId);
      const scores = data.holeScores.filter((hs) => hs.roundId === r.id);
      const totalStrokes = scores.reduce((sum, s) => sum + s.strokes, 0);
      const totalPutts = scores.reduce((sum, s) => sum + s.putts, 0);
      return { ...r, courseName: course ? course.name : null, totalStrokes, totalPutts };
    })
    .sort((a, b) => (b.playedOn.localeCompare(a.playedOn)) || (b.id - a.id));
}

// ---------- holeScores ----------

// scores: [{courseHoleId, strokes, putts, fairwayHit, gir, penalty, note}, ...]
// 파3 홀은 fairwayHit을 반드시 null로 전달한다.
function saveHoleScores(roundId, scores) {
  const data = loadData();
  data.holeScores = data.holeScores.filter((hs) => hs.roundId !== roundId);
  for (const s of scores) {
    data.holeScores.push({
      id: nextId(data, "holeScores"),
      roundId,
      courseHoleId: s.courseHoleId,
      strokes: s.strokes,
      putts: s.putts,
      fairwayHit: s.fairwayHit ?? null,
      gir: s.gir ?? false,
      penalty: s.penalty ?? 0,
      note: s.note || null,
    });
  }
  saveData(data);
}

function getHoleScores(roundId) {
  const data = loadData();
  return data.holeScores
    .filter((hs) => hs.roundId === roundId)
    .map((hs) => {
      const hole = data.courseHoles.find((h) => h.id === hs.courseHoleId);
      return { ...hs, nineName: hole?.nineName, holeNo: hole?.holeNo, par: hole?.par };
    })
    .sort((a, b) => (a.nineName || "").localeCompare(b.nineName || "") || (a.holeNo || 0) - (b.holeNo || 0));
}

// ---------- roundPlayers ----------

// players: [{playerId, totalScore}, ...]
function setRoundPlayers(roundId, players) {
  const data = loadData();
  data.roundPlayers = data.roundPlayers.filter((rp) => rp.roundId !== roundId);
  for (const p of players) {
    data.roundPlayers.push({
      id: nextId(data, "roundPlayers"),
      roundId,
      playerId: p.playerId,
      totalScore: p.totalScore ?? null,
    });
  }
  saveData(data);
}

function getRoundPlayers(roundId) {
  const data = loadData();
  return data.roundPlayers
    .filter((rp) => rp.roundId === roundId)
    .map((rp) => {
      const player = data.players.find((p) => p.id === rp.playerId);
      return { ...rp, name: player?.name, displayName: player?.displayName };
    });
}

// ---------- 내보내기 (F-07) ----------

function csvEscape(value) {
  const s = value === null || value === undefined ? "" : String(value);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportRoundsToCsv() {
  const rounds = getAllRounds();
  const header = ["일자", "골프장", "코스조합", "날씨", "라운드유형", "비용", "총타수", "총퍼팅", "메모"];
  const rows = rounds.map((r) => [
    r.playedOn,
    r.courseName,
    r.nineCombo,
    r.weather,
    r.roundType,
    r.cost,
    r.totalStrokes,
    r.totalPutts,
    r.memo,
  ]);
  const csv = [header, ...rows].map((row) => row.map(csvEscape).join(",")).join("\n");
  return "﻿" + csv; // 엑셀 한글 깨짐 방지용 BOM
}

function downloadRoundsCsv() {
  const csv = exportRoundsToCsv();
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "golf_rounds.csv";
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- 화면: 골프장 관리 (F-01) ----------

let currentHoles = []; // 현재 편집 중인 홀 목록 (저장 전까지 메모리에만 존재)

function defaultHoles() {
  const holes = [];
  for (const nineName of ["OUT", "IN"]) {
    for (let holeNo = 1; holeNo <= 9; holeNo++) {
      holes.push({ nineName, holeNo, par: 4, handicap: null });
    }
  }
  return holes;
}

function renderCourseList() {
  const tbody = document.getElementById("course-tbody");
  tbody.innerHTML = "";
  for (const course of getAllCourses()) {
    const holeCount = getCourseHoles(course.id).length;
    const tr = document.createElement("tr");

    const tdName = document.createElement("td");
    tdName.textContent = course.name;
    const tdRegion = document.createElement("td");
    tdRegion.textContent = course.region || "";
    const tdMemo = document.createElement("td");
    tdMemo.textContent = course.memo || "";
    const tdHoleCount = document.createElement("td");
    tdHoleCount.textContent = holeCount + "개";

    const tdActions = document.createElement("td");
    tdActions.className = "row-actions";
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.textContent = "수정";
    editBtn.addEventListener("click", () => startEditCourse(course.id));
    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.textContent = "삭제";
    deleteBtn.addEventListener("click", () => onDeleteCourse(course.id, course.name));
    tdActions.append(editBtn, deleteBtn);

    tr.append(tdName, tdRegion, tdMemo, tdHoleCount, tdActions);
    tbody.appendChild(tr);
  }
  refreshCourseOptions();
}

function startEditCourse(courseId) {
  const course = getCourse(courseId);
  if (!course) return;
  document.getElementById("course-id").value = course.id;
  document.getElementById("course-name").value = course.name;
  document.getElementById("course-region").value = course.region || "";
  document.getElementById("course-memo").value = course.memo || "";
  document.getElementById("course-form-cancel").style.display = "inline";

  const holes = getCourseHoles(courseId);
  currentHoles = holes.length > 0 ? holes.map((h) => ({ ...h })) : defaultHoles();
  showHoleSection(course.name);
}

function resetCourseForm() {
  document.getElementById("course-id").value = "";
  document.getElementById("course-name").value = "";
  document.getElementById("course-region").value = "";
  document.getElementById("course-memo").value = "";
  document.getElementById("course-form-cancel").style.display = "none";
  document.getElementById("hole-section").style.display = "none";
  currentHoles = [];
}

function onDeleteCourse(courseId, courseName) {
  if (!confirm(`"${courseName}"을(를) 삭제할까요? 저장된 홀 정보도 함께 삭제됩니다.`)) return;
  deleteCourse(courseId);
  resetCourseForm();
  renderCourseList();
}

function showHoleSection(courseName) {
  document.getElementById("hole-section-title").textContent = `홀 정보 — ${courseName}`;
  document.getElementById("hole-section").style.display = "block";
  renderHoleTable();
}

function renderHoleTable() {
  const tbody = document.getElementById("hole-tbody");
  tbody.innerHTML = "";
  currentHoles.forEach((hole, index) => {
    const tr = document.createElement("tr");
    tr.className = "hole-row";

    const tdNine = document.createElement("td");
    const nineInput = document.createElement("input");
    nineInput.type = "text";
    nineInput.value = hole.nineName;
    nineInput.addEventListener("input", () => { hole.nineName = nineInput.value; });
    tdNine.appendChild(nineInput);

    const tdHoleNo = document.createElement("td");
    const holeNoInput = document.createElement("input");
    holeNoInput.type = "number";
    holeNoInput.min = "1";
    holeNoInput.value = hole.holeNo;
    holeNoInput.addEventListener("input", () => { hole.holeNo = Number(holeNoInput.value); });
    tdHoleNo.appendChild(holeNoInput);

    const tdPar = document.createElement("td");
    const parInput = document.createElement("input");
    parInput.type = "number";
    parInput.min = "3";
    parInput.max = "5";
    parInput.value = hole.par;
    parInput.addEventListener("input", () => { hole.par = Number(parInput.value); });
    tdPar.appendChild(parInput);

    const tdActions = document.createElement("td");
    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.textContent = "삭제";
    removeBtn.addEventListener("click", () => {
      currentHoles.splice(index, 1);
      renderHoleTable();
    });
    tdActions.appendChild(removeBtn);

    tr.append(tdNine, tdHoleNo, tdPar, tdActions);
    tbody.appendChild(tr);
  });
}

function initCourseScreen() {
  document.getElementById("course-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("course-name").value.trim();
    if (!name) return;
    const region = document.getElementById("course-region").value.trim();
    const memo = document.getElementById("course-memo").value.trim();
    const idValue = document.getElementById("course-id").value;

    let courseId;
    if (idValue) {
      courseId = Number(idValue);
      updateCourse(courseId, name, region, memo);
    } else {
      courseId = addCourse(name, region, memo);
      currentHoles = defaultHoles();
    }
    document.getElementById("course-id").value = courseId;
    document.getElementById("course-form-cancel").style.display = "inline";
    renderCourseList();
    showHoleSection(name);
  });

  document.getElementById("course-form-cancel").addEventListener("click", resetCourseForm);

  document.getElementById("hole-add-row").addEventListener("click", () => {
    currentHoles.push({ nineName: "", holeNo: currentHoles.length + 1, par: 4, handicap: null });
    renderHoleTable();
  });

  document.getElementById("hole-save-btn").addEventListener("click", () => {
    const courseId = Number(document.getElementById("course-id").value);
    if (!courseId) return;
    replaceCourseHoles(courseId, currentHoles);
    alert("홀 정보를 저장했습니다.");
    renderCourseList();
  });

  renderCourseList();
}

// ---------- 화면: 라운드 신규 등록 (F-02) ----------

function refreshCourseOptions() {
  const select = document.getElementById("round-course-id");
  const prevValue = select.value;
  select.innerHTML = "";
  for (const course of getAllCourses()) {
    const option = document.createElement("option");
    option.value = course.id;
    option.textContent = course.name;
    select.appendChild(option);
  }
  if (prevValue) select.value = prevValue;
}

function resetRoundForm() {
  document.getElementById("round-id").value = "";
  document.getElementById("round-form").reset();
  document.getElementById("round-form-title").textContent = "라운드 신규 등록 (F-02)";
  document.getElementById("round-form-submit").textContent = "라운드 저장";
  document.getElementById("round-form-cancel").style.display = "none";
}

function startEditRound(roundId) {
  const round = getRound(roundId);
  if (!round) return;
  document.getElementById("round-id").value = round.id;
  document.getElementById("round-played-on").value = round.playedOn;
  document.getElementById("round-course-id").value = round.courseId;
  document.getElementById("round-nine-combo").value = round.nineCombo || "";
  document.getElementById("round-tee-time").value = round.teeTime || "";
  document.getElementById("round-weather").value = round.weather || "";
  document.getElementById("round-type").value = round.roundType || "";
  document.getElementById("round-cost").value = round.cost ?? "";
  document.getElementById("round-memo").value = round.memo || "";
  document.getElementById("round-form-title").textContent = "라운드 수정 (F-06)";
  document.getElementById("round-form-submit").textContent = "수정 저장";
  document.getElementById("round-form-cancel").style.display = "inline";
  document.getElementById("round-section").scrollIntoView({ behavior: "smooth" });
}

function onDeleteRound(roundId) {
  if (!confirm("이 라운드를 삭제할까요? 홀별 스코어와 동반자 기록도 함께 삭제됩니다.")) return;
  deleteRound(roundId);
  document.getElementById("round-detail").style.display = "none";
  refreshRoundOptions();
  refreshRoundPlayerOptions();
  renderRoundList();
}

function initRoundScreen() {
  document.getElementById("round-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const courseId = Number(document.getElementById("round-course-id").value);
    if (!courseId) {
      alert("골프장을 먼저 등록해주세요.");
      return;
    }
    const costValue = document.getElementById("round-cost").value;
    const roundData = {
      playedOn: document.getElementById("round-played-on").value,
      courseId,
      nineCombo: document.getElementById("round-nine-combo").value.trim(),
      teeTime: document.getElementById("round-tee-time").value,
      weather: document.getElementById("round-weather").value.trim(),
      roundType: document.getElementById("round-type").value.trim(),
      cost: costValue === "" ? null : Number(costValue),
      memo: document.getElementById("round-memo").value.trim(),
    };
    const idValue = document.getElementById("round-id").value;
    if (idValue) {
      updateRound(Number(idValue), roundData);
      alert("라운드를 수정했습니다.");
    } else {
      addRound(roundData);
      alert("라운드를 저장했습니다.");
    }
    resetRoundForm();
    refreshRoundOptions();
    refreshRoundPlayerOptions();
    renderRoundList();
  });

  document.getElementById("round-form-cancel").addEventListener("click", resetRoundForm);

  refreshCourseOptions();
}

// ---------- 화면: 홀별 스코어 입력 (F-03) ----------

let currentScores = []; // 현재 편집 중인 홀별 스코어 (저장 전까지 메모리에만 존재)

function roundLabel(round) {
  return `${round.playedOn} ${round.courseName}${round.nineCombo ? " (" + round.nineCombo + ")" : ""}`;
}

function refreshRoundOptions() {
  const select = document.getElementById("score-round-id");
  const prevValue = select.value;
  select.innerHTML = '<option value="">-- 라운드를 선택하세요 --</option>';
  for (const round of getAllRounds()) {
    const option = document.createElement("option");
    option.value = round.id;
    option.textContent = roundLabel(round);
    select.appendChild(option);
  }
  if (prevValue) select.value = prevValue;
}

function updateScoreTotal() {
  const totalStrokes = currentScores.reduce((sum, s) => sum + (Number(s.strokes) || 0), 0);
  const totalPutts = currentScores.reduce((sum, s) => sum + (Number(s.putts) || 0), 0);
  document.getElementById("score-total").textContent = `합계 — 타수: ${totalStrokes} / 퍼팅: ${totalPutts}`;
}

function renderScoreTable() {
  const tbody = document.getElementById("score-tbody");
  tbody.innerHTML = "";
  currentScores.forEach((s) => {
    const tr = document.createElement("tr");

    const tdNine = document.createElement("td");
    tdNine.textContent = s.nineName;
    const tdHoleNo = document.createElement("td");
    tdHoleNo.textContent = s.holeNo;
    const tdPar = document.createElement("td");
    tdPar.textContent = s.par;

    const tdStrokes = document.createElement("td");
    const strokesInput = document.createElement("input");
    strokesInput.type = "number";
    strokesInput.min = "1";
    strokesInput.value = s.strokes;
    strokesInput.addEventListener("input", () => { s.strokes = Number(strokesInput.value); updateScoreTotal(); });
    tdStrokes.appendChild(strokesInput);

    const tdPutts = document.createElement("td");
    const puttsInput = document.createElement("input");
    puttsInput.type = "number";
    puttsInput.min = "0";
    puttsInput.value = s.putts;
    puttsInput.addEventListener("input", () => { s.putts = Number(puttsInput.value); updateScoreTotal(); });
    tdPutts.appendChild(puttsInput);

    const tdFairway = document.createElement("td");
    if (s.par === 3) {
      tdFairway.textContent = "해당없음";
      s.fairwayHit = null;
    } else {
      const fairwayInput = document.createElement("input");
      fairwayInput.type = "checkbox";
      fairwayInput.checked = !!s.fairwayHit;
      fairwayInput.addEventListener("change", () => { s.fairwayHit = fairwayInput.checked; });
      tdFairway.appendChild(fairwayInput);
    }

    const tdGir = document.createElement("td");
    const girInput = document.createElement("input");
    girInput.type = "checkbox";
    girInput.checked = !!s.gir;
    girInput.addEventListener("change", () => { s.gir = girInput.checked; });
    tdGir.appendChild(girInput);

    const tdPenalty = document.createElement("td");
    const penaltyInput = document.createElement("input");
    penaltyInput.type = "number";
    penaltyInput.min = "0";
    penaltyInput.value = s.penalty;
    penaltyInput.addEventListener("input", () => { s.penalty = Number(penaltyInput.value); });
    tdPenalty.appendChild(penaltyInput);

    tr.append(tdNine, tdHoleNo, tdPar, tdStrokes, tdPutts, tdFairway, tdGir, tdPenalty);
    tbody.appendChild(tr);
  });
  updateScoreTotal();
}

function loadScoreEditor(roundId) {
  const round = getRound(roundId);
  if (!round) return;
  const holes = getCourseHoles(round.courseId);
  const existing = getHoleScores(roundId);

  currentScores = holes.map((hole) => {
    const found = existing.find((e) => e.courseHoleId === hole.id);
    return {
      courseHoleId: hole.id,
      nineName: hole.nineName,
      holeNo: hole.holeNo,
      par: hole.par,
      strokes: found ? found.strokes : hole.par,
      putts: found ? found.putts : 2,
      fairwayHit: found ? found.fairwayHit : (hole.par === 3 ? null : false),
      gir: found ? found.gir : false,
      penalty: found ? found.penalty : 0,
    };
  });

  document.getElementById("score-table").style.display = "table";
  document.getElementById("score-total").style.display = "block";
  document.getElementById("score-save-btn").style.display = "inline";
  renderScoreTable();
}

function initScoreScreen() {
  document.getElementById("score-round-id").addEventListener("change", (e) => {
    const roundId = Number(e.target.value);
    if (!roundId) {
      document.getElementById("score-table").style.display = "none";
      document.getElementById("score-total").style.display = "none";
      document.getElementById("score-save-btn").style.display = "none";
      currentScores = [];
      return;
    }
    loadScoreEditor(roundId);
  });

  document.getElementById("score-save-btn").addEventListener("click", () => {
    const roundId = Number(document.getElementById("score-round-id").value);
    if (!roundId) return;
    saveHoleScores(roundId, currentScores);
    alert("스코어를 저장했습니다.");
    refreshRoundOptions();
    renderRoundList();
  });

  refreshRoundOptions();
}

// ---------- 화면: 동반자 명부 (F-04) ----------

function renderPlayerList() {
  const tbody = document.getElementById("player-tbody");
  tbody.innerHTML = "";
  for (const player of getAllPlayers()) {
    const tr = document.createElement("tr");

    const tdName = document.createElement("td");
    tdName.textContent = player.name;
    const tdDisplayName = document.createElement("td");
    tdDisplayName.textContent = player.displayName || "";
    const tdRelation = document.createElement("td");
    tdRelation.textContent = player.relation || "";
    const tdMemo = document.createElement("td");
    tdMemo.textContent = player.memo || "";

    const tdActions = document.createElement("td");
    tdActions.className = "row-actions";
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.textContent = "수정";
    editBtn.addEventListener("click", () => startEditPlayer(player.id));
    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.textContent = "삭제";
    deleteBtn.addEventListener("click", () => onDeletePlayer(player.id, player.name));
    tdActions.append(editBtn, deleteBtn);

    tr.append(tdName, tdDisplayName, tdRelation, tdMemo, tdActions);
    tbody.appendChild(tr);
  }
  refreshRoundPlayerCheckboxState();
}

function startEditPlayer(playerId) {
  const player = getAllPlayers().find((p) => p.id === playerId);
  if (!player) return;
  document.getElementById("player-id").value = player.id;
  document.getElementById("player-name").value = player.name;
  document.getElementById("player-display-name").value = player.displayName || "";
  document.getElementById("player-relation").value = player.relation || "";
  document.getElementById("player-memo").value = player.memo || "";
  document.getElementById("player-form-cancel").style.display = "inline";
}

function resetPlayerForm() {
  document.getElementById("player-id").value = "";
  document.getElementById("player-name").value = "";
  document.getElementById("player-display-name").value = "";
  document.getElementById("player-relation").value = "";
  document.getElementById("player-memo").value = "";
  document.getElementById("player-form-cancel").style.display = "none";
}

function onDeletePlayer(playerId, name) {
  if (!confirm(`"${name}"을(를) 명부에서 삭제할까요? 기존 라운드에 연결된 기록도 함께 삭제됩니다.`)) return;
  deletePlayer(playerId);
  renderPlayerList();
}

function initPlayerScreen() {
  document.getElementById("player-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("player-name").value.trim();
    if (!name) return;
    const displayName = document.getElementById("player-display-name").value.trim();
    const relation = document.getElementById("player-relation").value.trim();
    const memo = document.getElementById("player-memo").value.trim();
    const idValue = document.getElementById("player-id").value;

    if (idValue) {
      updatePlayer(Number(idValue), name, displayName, relation, memo);
    } else {
      addPlayer(name, displayName, relation, memo);
    }
    resetPlayerForm();
    renderPlayerList();
  });

  document.getElementById("player-form-cancel").addEventListener("click", resetPlayerForm);

  renderPlayerList();
}

// ---------- 화면: 라운드 동반자 연결 (F-04) ----------

function refreshRoundPlayerOptions() {
  const select = document.getElementById("round-player-round-id");
  const prevValue = select.value;
  select.innerHTML = '<option value="">-- 라운드를 선택하세요 --</option>';
  for (const round of getAllRounds()) {
    const option = document.createElement("option");
    option.value = round.id;
    option.textContent = roundLabel(round);
    select.appendChild(option);
  }
  if (prevValue) select.value = prevValue;
}

function refreshRoundPlayerCheckboxState() {
  const roundId = Number(document.getElementById("round-player-round-id").value);
  if (!roundId) return;
  loadRoundPlayerEditor(roundId);
}

function loadRoundPlayerEditor(roundId) {
  const players = getAllPlayers();
  const linked = getRoundPlayers(roundId);
  const tbody = document.getElementById("round-player-tbody");
  tbody.innerHTML = "";

  for (const player of players) {
    const link = linked.find((l) => l.playerId === player.id);
    const tr = document.createElement("tr");

    const tdCheck = document.createElement("td");
    const checkInput = document.createElement("input");
    checkInput.type = "checkbox";
    checkInput.checked = !!link;
    checkInput.dataset.playerId = player.id;
    tdCheck.appendChild(checkInput);

    const tdName = document.createElement("td");
    tdName.textContent = player.name;

    const tdScore = document.createElement("td");
    const scoreInput = document.createElement("input");
    scoreInput.type = "number";
    scoreInput.min = "0";
    scoreInput.value = link && link.totalScore !== null ? link.totalScore : "";
    scoreInput.dataset.playerId = player.id;
    tdScore.appendChild(scoreInput);

    tr.append(tdCheck, tdName, tdScore);
    tbody.appendChild(tr);
  }

  document.getElementById("round-player-table").style.display = players.length ? "table" : "none";
  document.getElementById("round-player-save-btn").style.display = players.length ? "inline" : "none";
}

function initRoundPlayerScreen() {
  document.getElementById("round-player-round-id").addEventListener("change", (e) => {
    const roundId = Number(e.target.value);
    if (!roundId) {
      document.getElementById("round-player-table").style.display = "none";
      document.getElementById("round-player-save-btn").style.display = "none";
      return;
    }
    loadRoundPlayerEditor(roundId);
  });

  document.getElementById("round-player-save-btn").addEventListener("click", () => {
    const roundId = Number(document.getElementById("round-player-round-id").value);
    if (!roundId) return;
    const rows = document.querySelectorAll("#round-player-tbody tr");
    const players = [];
    rows.forEach((tr) => {
      const checkInput = tr.querySelector('input[type="checkbox"]');
      if (!checkInput.checked) return;
      const scoreInput = tr.querySelector('input[type="number"]');
      const playerId = Number(checkInput.dataset.playerId);
      const totalScore = scoreInput.value === "" ? null : Number(scoreInput.value);
      players.push({ playerId, totalScore });
    });
    setRoundPlayers(roundId, players);
    alert("동반자를 저장했습니다.");
  });

  refreshRoundPlayerOptions();
}

// ---------- 화면: 라운드 목록 조회 (F-05) ----------

function renderRoundList() {
  const tbody = document.getElementById("round-list-tbody");
  tbody.innerHTML = "";
  for (const round of getAllRounds()) {
    const tr = document.createElement("tr");
    tr.style.cursor = "pointer";

    const tdDate = document.createElement("td");
    tdDate.textContent = round.playedOn;
    const tdCourse = document.createElement("td");
    tdCourse.textContent = round.courseName || "";
    const tdCombo = document.createElement("td");
    tdCombo.textContent = round.nineCombo || "";
    const tdStrokes = document.createElement("td");
    tdStrokes.textContent = round.totalStrokes;
    const tdPutts = document.createElement("td");
    tdPutts.textContent = round.totalPutts;
    const tdCost = document.createElement("td");
    tdCost.textContent = round.cost ?? "";

    tr.append(tdDate, tdCourse, tdCombo, tdStrokes, tdPutts, tdCost);
    tr.addEventListener("click", () => showRoundDetail(round.id));
    tbody.appendChild(tr);
  }
}

function showRoundDetail(roundId) {
  const round = getRound(roundId);
  if (!round) return;
  const scores = getHoleScores(roundId);
  const totalStrokes = scores.reduce((sum, s) => sum + s.strokes, 0);
  const totalPutts = scores.reduce((sum, s) => sum + s.putts, 0);

  document.getElementById("round-detail-summary").textContent =
    `${round.playedOn} · ${round.courseName}${round.nineCombo ? " (" + round.nineCombo + ")" : ""}` +
    ` · 총타수 ${totalStrokes} · 총퍼팅 ${totalPutts}` +
    (round.weather ? ` · 날씨 ${round.weather}` : "") +
    (round.roundType ? ` · 유형 ${round.roundType}` : "") +
    (round.cost != null ? ` · 비용 ${round.cost}` : "") +
    (round.memo ? ` · 메모 ${round.memo}` : "");

  const holesTbody = document.getElementById("round-detail-holes-tbody");
  holesTbody.innerHTML = "";
  for (const s of scores) {
    const tr = document.createElement("tr");
    const cells = [
      s.nineName,
      s.holeNo,
      s.par,
      s.strokes,
      s.putts,
      s.par === 3 ? "해당없음" : (s.fairwayHit ? "O" : "X"),
      s.gir ? "O" : "X",
      s.penalty,
    ];
    for (const value of cells) {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    }
    holesTbody.appendChild(tr);
  }

  const players = getRoundPlayers(roundId);
  document.getElementById("round-detail-players").textContent = players.length
    ? "동반자: " + players.map((p) => `${p.name}(${p.totalScore ?? "-"})`).join(", ")
    : "동반자: 없음";

  document.getElementById("round-detail-edit-btn").onclick = () => startEditRound(round.id);
  document.getElementById("round-detail-delete-btn").onclick = () => onDeleteRound(round.id);

  document.getElementById("round-detail").style.display = "block";
}

// ---------- 화면: CSV 내보내기 (F-07) ----------

function initCsvExportScreen() {
  document.getElementById("csv-export-btn").addEventListener("click", () => {
    if (getAllRounds().length === 0) {
      alert("내보낼 라운드가 없습니다.");
      return;
    }
    downloadRoundsCsv();
  });
}

initCourseScreen();
initRoundScreen();
initScoreScreen();
initPlayerScreen();
initRoundPlayerScreen();
initCsvExportScreen();
renderRoundList();
</script>
